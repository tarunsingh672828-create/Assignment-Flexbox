<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
.con{
    height: 600px;
    border: 1px solid black
}
.header,.footer{
    height: 20%;
    background-color: midnightblue;
}
.center{
height: 60%;
background-color: black;
display: flex;
}
.left{
height: 100%;
width: 20%;
background-color: rebeccapurple;
}
.right{
height: 100%;
width: 80%;
background-color: brown;
}
.up{
height: 50%;
width: 100%;
background-color: coral;

}
.down{
    height: 50%;
width: 100%;
background-color: black;
display: flex;
}
.l{
    height: 100%;
    width: 50%;
    background-color: skyblue;
}
.r{height: 100%;
    width: 50%;
    background-color: whitesmoke;

}
h1{
    text-align: center;
}
</style>


</head>

<body>
<h1>FLEX BOX</h1>
<div class="con">
    <div class="header"></div>
<div class="center">
<div class="left"></div>
<div class="right">
<div class="up"></div>
<div class="down">
    <div class="r"></div>
    <div class="l"></div>
</div>
</div>
</div>
<div class="footer"></div>

</div>
    
</body>
</html>
